<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Reports — live preview</title>
<style>
  :root{--bg:#FDFBF7;--card:#fff;--line:#e8ddd0;--ink:#3E2723;--ink2:#5D4037;--mut:#9a8979;--accent:#C6761E;--good:#3E8E5A;--hi:#C0392B;--serif:"Source Serif 4",Georgia,"Times New Roman",serif}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px}
  .brandbar{display:flex;align-items:center;gap:10px;padding:13px 0 10px;border-bottom:2px solid var(--accent)}
  .brandbar img{height:32px;width:32px;object-fit:contain}
  .seplabel{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:-.3px} .sub2{font-size:12px;color:var(--mut);border-left:1px solid var(--line);padding-left:10px;text-transform:uppercase;letter-spacing:.08em}
  .tabs{display:flex;width:fit-content;max-width:100%;justify-content:center;gap:3px;flex-wrap:wrap;margin:16px auto 12px;padding:4px;background:#f3e9dc;border:1px solid #e8ddd0;border-radius:13px}
  .tab{padding:8px 16px;color:var(--ink2);font-size:13px;font-weight:600;border-radius:9px} .tab.active{background:var(--accent);color:#fff}
  .pill{display:inline-block;background:#f6ecdf;border:1px solid #e8ddd0;border-radius:7px;padding:3px 9px;margin:2px;font-size:12px;color:var(--ink2);font-weight:500}
  .rv{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:18px;align-items:start}@media(max-width:820px){.rv{grid-template-columns:1fr}}
  .rv-rail{display:flex;flex-direction:column;gap:14px}.rv-lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;margin:2px 2px 6px}.rv-week{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px}
  .rv-card{display:flex;flex-direction:column;gap:5px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:11px;padding:12px 13px;cursor:pointer}.rv-card.on{border-color:var(--accent);border-left-color:var(--accent);box-shadow:0 2px 10px rgba(198,118,30,.13)}
  .rv-top{display:flex;align-items:center;gap:8px}.rv-ic{font-size:16px}.rv-nm{font-weight:600;font-size:14px}.rv-prev{font-size:12px;color:var(--mut);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rv-meta{font-size:11px;color:var(--mut);margin-top:2px}
  .rv-st{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid transparent}.rv-st.live{background:#e7f1ea;color:var(--good);border-color:#bfdcca}.rv-st.draft{background:#fbf0dd;color:#9a6a12;border-color:#e6d3a8}.rv-st.none{background:#f1ece6;color:var(--mut);border-color:var(--line)}
  .rv-doc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 32px;box-shadow:0 1px 3px rgba(62,39,35,.05);min-height:420px}
  .rv-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}.rv-head h1{font-family:var(--serif);font-size:24px;font-weight:700;margin:0;flex:1;min-width:220px;line-height:1.2}.rv-sub{font-size:12.5px;color:var(--mut);margin-top:5px}
  .rv-callout{background:linear-gradient(180deg,#fdf6ea,#fbf0dd);border:1px solid #efdcb6;border-radius:11px;padding:15px 17px;font-family:var(--serif);font-size:16px;line-height:1.5;margin-bottom:20px}.rv-callout .cl{display:block;font-family:-apple-system,sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-bottom:6px}
  .rv-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}.rv-m{background:#fdfaf5;border:1px solid var(--line);border-radius:11px;padding:12px 13px}.rv-m .ml{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.rv-m .mv{font-family:var(--serif);font-size:22px;font-weight:700;margin-top:3px;line-height:1}.rv-m .md{font-size:12px;font-weight:600;margin-top:5px}.rv-m .md.up{color:var(--good)}.rv-m .md.down{color:var(--hi)}.rv-m .md.flat{color:var(--mut)}
  .rv-sec{margin-bottom:22px}.rv-sec h2{font-family:var(--serif);font-size:16px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}.rv-sec h2 .ct{font-family:-apple-system,sans-serif;font-size:11px;font-weight:700;color:var(--mut);background:#f3ece4;border-radius:20px;padding:1px 8px}
  ol.rv-find{list-style:none;margin:0;padding:0;counter-reset:f}ol.rv-find li{counter-increment:f;position:relative;padding:9px 0 9px 30px;border-bottom:1px solid var(--line);color:var(--ink2);font-size:13.5px;line-height:1.5}ol.rv-find li:last-child{border-bottom:none}ol.rv-find li::before{content:counter(f);position:absolute;left:0;top:9px;width:21px;height:21px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}ol.rv-wins li::before{background:#e7f1ea;color:var(--good)}ol.rv-cons li::before{background:#fbece9;color:var(--hi)}.rv-find b{color:var(--ink)}
  .rv-act{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.rv-act:last-child{border-bottom:none}.rv-act .pr{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:52px}.rv-act .prn{font-size:10px;font-weight:800;letter-spacing:.05em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 7px}.rv-act .prn.p1{background:var(--hi)}.rv-act .prn.p2{background:#D9822B}.rv-act .wh{font-size:10px;color:var(--mut);text-transform:uppercase}.rv-act .at{font-weight:700;color:var(--ink);font-size:13.5px}.rv-act .ab{color:var(--ink2);font-size:13px;margin-top:2px;line-height:1.5}
  .rv-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:60px 24px;color:var(--mut)}.rv-empty .ei{font-size:32px;opacity:.6}.rv-empty .et{font-family:var(--serif);font-size:18px;color:var(--ink2)}
  .rv-md h2{font-family:var(--serif);font-size:15px;font-weight:700;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}.rv-md h3{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 0 6px}.rv-md p{margin:8px 0;color:var(--ink2)}.rv-md ul,.rv-md ol{margin:8px 0;padding-left:22px;color:var(--ink2)}.rv-md li{margin:4px 0}.rv-md blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--accent);background:#fdf8f1;border-radius:0 8px 8px 0}
  .badge{position:fixed;bottom:14px;left:14px;background:var(--ink);color:#fbf0dd;font-size:11px;padding:6px 11px;border-radius:20px;opacity:.92}
</style></head><body>
<div class="wrap">
  <div class="brandbar"><img src="public/icon.png" alt=""><span class="seplabel">StableTrack</span><span class="sub2">Content Pipeline</span></div>
  <div class="tabs"><div class="tab active">📄 Weekly Reports</div><div class="tab">🚨 Action Items</div><div class="tab">📣 Social</div><div class="tab">📈 SEO</div><div class="tab">🧠 Strategy</div><div class="tab">🔭 Market Intel</div></div>
  <div class="rv">
    <aside class="rv-rail"><div><div class="rv-lbl">Week</div><select class="rv-week" id="wkSel" onchange="pickWeek(this.value)"></select></div><div><div class="rv-lbl">Reports this week</div><div id="rvCards"></div></div></aside>
    <article class="rv-doc" id="rvDoc"></article>
  </div>
</div>
<div class="badge">LOCAL PREVIEW · exact dashboard render, real data</div>
<script src="preview-data.js"></script>
<script>
const D={weekly:PREVIEW.weekly,intel:PREVIEW.intel,brief:PREVIEW.brief,slate:PREVIEW.slate||[]};
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const asArr=v=>{if(Array.isArray(v))return v;if(v==null||v==='')return [];try{const p=JSON.parse(v);return Array.isArray(p)?p:[];}catch(e){return [];}};
const fmtWk=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');return isNaN(d)?String(s):d.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});};
function mdRender(src){if(!src)return '';const lines=String(src).split('\n');const out=[];const stack=[];
  const inl=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/_([^_]+)_/g,'<em>$1</em>');
  const closeAll=()=>{while(stack.length)out.push('</'+stack.pop()+'>');};
  for(const raw of lines){const line=raw.trim();if(!line)continue;const li=raw.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if(li){const tag=/\d+\./.test(li[2])?'ol':'ul';if(!stack.length){stack.push(tag);out.push('<'+tag+'>');}out.push('<li>'+inl(li[3])+'</li>');continue;}
    closeAll();let m;if((m=line.match(/^(#{1,6})\s+(.*)$/))){const h=Math.min(m[1].length,3);out.push('<h'+h+'>'+inl(m[2])+'</h'+h+'>');continue;}
    if((m=line.match(/^>\s?(.*)$/))){out.push('<blockquote>'+inl(m[1])+'</blockquote>');continue;}out.push('<p>'+inl(line)+'</p>');}
  closeAll();return out.join('');}
const RV={week:null,type:'performance'};
function renderReports(){const weeks=[...new Set((D.weekly||[]).map(r=>r.week_start))];const sel=document.getElementById('wkSel');
  sel.innerHTML=weeks.map((w,i)=>`<option value="${w}">Week of ${fmtWk(w)}${i===0?' · latest':''}</option>`).join('');
  if(!RV.week||!weeks.includes(RV.week))RV.week=weeks[0];sel.value=RV.week;renderRvRail();renderRvDoc();}
function pickWeek(w){RV.week=w;renderRvRail();renderRvDoc();}
function pickType(t){RV.type=t;renderRvRail();renderRvDoc();}
function rvReports(){const perf=(D.weekly||[]).find(r=>r.week_start===RV.week)||null;const intel=(D.intel||[])[0]||null,brief=(D.brief||[])[0]||null;
  return{performance:perf?{icon:'📈',name:'Performance',status:(perf.status||'').toLowerCase()==='published'?'live':(perf.status?'draft':'none'),statusLabel:perf.status||'Draft',preview:perf.headline||'—',meta:'analyst report'}:null,
    intel:intel?{icon:'🔭',name:'Market Intel',status:'live',statusLabel:'Live',preview:intel.headline||'—',meta:(intel.signals_generated!=null?intel.signals_generated+' signals':'')}:null,
    strategy:brief?{icon:'🧠',name:'Strategy',status:'live',statusLabel:'Active',preview:brief.focus||'—',meta:(brief.period_start||'')+' → '+(brief.period_end||'')}:{icon:'🧠',name:'Strategy',status:'none',statusLabel:'No brief',preview:'No active brief — latest draft awaiting Slack approval.',meta:'awaiting approval'}};}
function renderRvRail(){const R=rvReports();document.getElementById('rvCards').innerHTML=['performance','intel','strategy'].map(t=>{const r=R[t];if(!r)return '';
  return `<div class="rv-card${t===RV.type?' on':''}" onclick="pickType('${t}')"><div class="rv-top"><span class="rv-ic">${r.icon}</span><span class="rv-nm">${r.name}</span><span style="flex:1"></span><span class="rv-st ${r.status}">${esc(r.statusLabel)}</span></div><div class="rv-prev">${esc(r.preview)}</div><div class="rv-meta">${esc(r.meta)}</div></div>`;}).join('');}
function metricTile(m){let d='';if(m.delta!=null){const good=m.lowerIsBetter?m.delta<0:m.delta>=0;const dir=m.delta===0?'flat':(good?'up':'down');const sign=m.delta>=0?'+':'';d=`<div class="md ${dir}">${dir==='up'?'▲ ':dir==='down'?'▼ ':''}${sign}${m.delta}${m.deltaKind==='pp'?' pp':'%'}</div>`;}
  return `<div class="rv-m"><div class="ml">${esc(m.label)}</div><div class="mv">${esc(String(m.value))}${esc(m.suffix||'')}</div>${d}</div>`;}
function renderRvDoc(){const el=document.getElementById('rvDoc');const t=RV.type;
  if(t==='performance'){const r=(D.weekly||[]).find(x=>x.week_start===RV.week);if(!r){el.innerHTML='<div class="rv-empty"><div class="ei">📭</div><div class="et">No report</div></div>';return;}
    const wins=asArr(r.top_wins),cons=asArr(r.top_concerns),acts=asArr(r.action_items),mets=asArr(r.report_metrics);
    let h=`<div class="rv-head"><h1>StableTrack — Weekly Performance</h1><div><span class="rv-st ${(r.status||'').toLowerCase()==='published'?'live':'draft'}">${esc(r.status||'Draft')}</span><div class="rv-sub">Week of ${fmtWk(r.week_start)}</div></div></div>`;
    if(r.headline)h+=`<div class="rv-callout"><span class="cl">The week in one line</span>${esc(r.headline)}</div>`;
    if(mets.length)h+=`<div class="rv-metrics">${mets.map(metricTile).join('')}</div>`;
    if(wins.length)h+=`<div class="rv-sec"><h2>✅ Top wins <span class="ct">${wins.length}</span></h2><ol class="rv-find rv-wins">${wins.map(w=>'<li>'+esc(w)+'</li>').join('')}</ol></div>`;
    if(cons.length)h+=`<div class="rv-sec"><h2>⚠️ Top concerns <span class="ct">${cons.length}</span></h2><ol class="rv-find rv-cons">${cons.map(c=>'<li>'+esc(c)+'</li>').join('')}</ol></div>`;
    if(acts.length)h+=`<div class="rv-sec"><h2>🎯 Action items <span class="ct">${acts.length}</span></h2>${acts.map((a,i)=>{const p=a.priority||('P'+(i+1));const cls=/1/.test(p)?'p1':/2/.test(p)?'p2':'';return `<div class="rv-act"><div class="pr"><span class="prn ${cls}">${esc(p)}</span><span class="wh">${esc(a.timeframe||'')}</span></div><div><div class="at">${esc(a.title||'')}</div><div class="ab">${esc(a.body||'')}</div></div></div>`;}).join('')}</div>`;
    if(r.report_md){let md=r.report_md;const cut=md.search(/\n##\s+Search/);if((wins.length||cons.length||acts.length)&&cut>0)md=md.slice(cut+1);h+=`<div class="rv-sec"><h2>📋 Full report</h2><div class="rv-md">${mdRender(md)}</div></div>`;}
    el.innerHTML=h;return;}
  if(t==='intel'){const r=(D.intel||[]).find(x=>x.product_type==='stabletrack')||(D.intel||[])[0];if(!r){el.innerHTML='<div class="rv-empty"><div class="ei">🔭</div><div class="et">No market-intel report</div></div>';return;}
    const themes=asArr(r.industry_themes),lang=asArr(r.customer_language),events=asArr(r.upcoming_events),topics=asArr(r.content_topics),comps=asArr(r.competitor_moves);
    const liArr=(arr,fn)=>'<ul class="rv-md" style="margin:0;padding-left:20px">'+arr.map(x=>'<li style="margin-bottom:7px">'+fn(x)+'</li>').join('')+'</ul>';
    const sec=(title,arr,fn)=>`<div class="rv-sec"><h2>${title} <span class="ct">${arr.length}</span></h2>${liArr(arr,fn)}</div>`;
    let h=`<div class="rv-head"><h1>StableTrack — Market Intelligence</h1><div><span class="rv-st live">${esc(r.status||'Live')}</span><div class="rv-sub">${esc(r.run_date||'')}</div></div></div>`;
    if(r.headline)h+=`<div class="rv-callout"><span class="cl">If we do ONE thing this fortnight</span>${esc(r.headline)}</div>`;
    const mi=[r.signals_generated!=null?{label:'Signals',value:r.signals_generated}:null,r.sources_scanned!=null?{label:'Sources scanned',value:r.sources_scanned}:null,{label:'Competitor moves',value:comps.length},{label:'Content ideas',value:topics.length}].filter(Boolean);
    if(mi.length)h+=`<div class="rv-metrics">${mi.map(metricTile).join('')}</div>`;
    if(r.top_3_actions)h+=`<div class="rv-sec"><h2>🎯 Top actions</h2><div class="rv-md">${mdRender(r.top_3_actions)}</div></div>`;
    if(comps.length)h+=sec('🥊 Top competitor moves',comps,c=>`<b>${esc(c.competitor||'')}</b>${c.threat_level?' <span class="pill">'+esc(c.threat_level)+' threat</span>':''}${c.move?'<br>'+esc(c.move):(c.sentiment?' — '+esc(c.sentiment):'')}${Array.isArray(c.complaints)&&c.complaints.length?'<br><span style="color:var(--mut)">'+esc(c.complaints[0])+'</span>':''}${c.source_url?' · <a href="'+esc(c.source_url)+'" target="_blank">source</a>':''}`);
    if(themes.length)h+=sec('🏭 Industry themes',themes,x=>`${x.trend?'<span class="pill">'+esc(x.trend)+'</span> ':''}${esc(x.theme||x.summary||'')}`);
    if(topics.length)h+=sec('✍️ Suggested content topics',topics,x=>`<b>${esc(x.topic||x.title||'')}</b>${x.pillar?' <span class="pill">'+esc(x.pillar)+'</span>':''}${x.rationale?'<br><span style="color:var(--mut)">'+esc(x.rationale)+'</span>':''}`);
    if(lang.length)h+=sec('💬 Customer language',lang,x=>'“'+esc(x.phrase||x.quote||'')+'”');
    if(events.length)h+=sec('📅 Upcoming events',events,x=>`<b>${esc(x.event||'')}</b>${x.date?' — '+esc(x.date):''}${x.action_needed?'<br><span style="color:var(--mut)">'+esc(x.action_needed)+'</span>':''}`);
    el.innerHTML=h;return;}
  const b=(D.brief||[])[0];if(!b){el.innerHTML='<div class="rv-empty"><div class="ei">🧠</div><div class="et">No active brief this week</div><div style="max-width:380px">The latest strategy draft is awaiting Slack approval.</div></div>';return;}
  const slate=D.slate||[],blogs=slate.filter(s=>s.type==='blog'),socials=slate.filter(s=>s.type==='social');
  const liArr=(arr,fn)=>'<ul class="rv-md" style="margin:0;padding-left:20px">'+arr.map(x=>'<li style="margin-bottom:9px">'+fn(x)+'</li>').join('')+'</ul>';
  const dl=(l,v)=>v?`<div style="margin:7px 0"><span style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:block">${l}</span>${esc(v)}</div>`:'';
  let h=`<div class="rv-head"><h1>StableTrack — Strategy Brief</h1><div><span class="rv-st live">${esc(b.status||'Active')}</span><div class="rv-sub">${esc(b.period_start||'')} → ${esc(b.period_end||'')}</div></div></div>`;
  if(b.headline_thesis||b.focus)h+=`<div class="rv-callout"><span class="cl">Headline thesis</span>${esc(b.headline_thesis||b.focus)}</div>`;
  h+=`<div class="rv-metrics">${[{label:'Blog topics',value:b.blog_topics!=null?b.blog_topics:blogs.length},{label:'Social posts',value:b.social_posts!=null?b.social_posts:socials.length}].map(metricTile).join('')}</div>`;
  if(b.summary)h+=`<div class="rv-sec"><h2>Summary</h2><div class="rv-md"><p>${esc(b.summary)}</p></div></div>`;
  let brief=dl('Focus',b.focus)+dl('Positioning',b.positioning)+dl('Audience',b.audience_focus)+dl('Tone',b.tone_hint)+dl('Not writing about',b.not_writing_about)+dl('Inputs read',b.inputs_read);
  if(brief.trim())h+=`<div class="rv-sec"><h2>📋 Brief</h2>${brief}</div>`;
  if(blogs.length)h+=`<div class="rv-sec"><h2>✍️ Blog topics <span class="ct">${blogs.length}</span></h2>${liArr(blogs,t=>`<b>${esc(t.item||'')}</b>${t.pillar?' <span class="pill">'+esc(t.pillar)+'</span>':''}${t.urgency?' <span class="pill">'+esc(t.urgency)+'</span>':''}${t.keyword?'<br>keyword: '+esc(t.keyword):''}${t.angle?'<br>'+esc(t.angle):''}`)}</div>`;
  if(socials.length)h+=`<div class="rv-sec"><h2>📣 Social posts <span class="ct">${socials.length}</span></h2>${liArr(socials,p=>`<b>${esc(p.post_concept||p.hook||'')}</b>${p.channel?' <span class="pill">'+esc(p.channel)+'</span>':''}${p.cta?'<br>CTA: '+esc(p.cta):''}${p.anchor?'<br>anchor: '+esc(p.anchor):''}`)}</div>`;
  el.innerHTML=h;}
renderReports();
</script></body></html>
